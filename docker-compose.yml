services:
  scanner-db:
    image: postgres:15-alpine
    container_name: pqc-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Required: no silent fallback to the postgres default password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-quarkshield_scanner}
    volumes:
      - scanner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  scanner-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-scanner-console
    restart: unless-stopped
    ports:
      - "80:5050"
      - "443:5443"
      - "${PORT:-5050}:5050"
      - "5001:5050"
      - "5002:5050"
      - "5003:5050"
      - "5004:5050"
      - "5005:5050"
    depends_on:
      scanner-db:
        condition: service_healthy
    environment:
      - PORT=5050
      - NODE_ENV=production
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_HOST=scanner-db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-quarkshield_scanner}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_FROM=${SMTP_FROM:-License@quarkshield.ai}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - JWT_SECRET=${JWT_SECRET:-}
      - LICENSE_SIGNING_SECRET=${LICENSE_SIGNING_SECRET:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-.quarkshield.ai}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TWO_FACTOR_ENC_KEY=${TWO_FACTOR_ENC_KEY:-}
      - CONNECTOR_ENC_KEY=${CONNECTOR_ENC_KEY:-}
      - CBOM_SIGNING_SECRET=${CBOM_SIGNING_SECRET:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-root@quarkshield.ai}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_FORCE=${BOOTSTRAP_ADMIN_FORCE:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_HOST_URL=${APP_HOST_URL:-https://quarkshield.ai}
      - SERVER_PUBLIC_URL=${SERVER_PUBLIC_URL:-}
      - QS_CENTRAL_URL=${QS_CENTRAL_URL:-}
      - QS_CENTRAL_SERVICE_TOKEN=${QS_CENTRAL_SERVICE_TOKEN:-}
      - DOWNLOADS_DIR=/app/agent/binaries
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - PQCA_INBOX=${PQCA_INBOX:-}
      - SUPPORT_INBOX=${SUPPORT_INBOX:-}
      - RESEND_SENDER_EMAIL=${RESEND_SENDER_EMAIL:-}
      - QS_DEMO_PKI=${QS_DEMO_PKI:-}
      - QS_GEO_DISABLE=${QS_GEO_DISABLE:-}
    volumes:
      # Origin TLS material persists across restarts (generated on first start).
      - scanner_certs:/app/certs
      # The whole .env is no longer mounted into the container: every variable the
      # app needs is passed explicitly above, so a file-read bug cannot expose it.

volumes:
  scanner_pg_data:
    driver: local
  scanner_certs:
    driver: local
