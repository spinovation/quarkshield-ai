services:
  scanner-db:
    image: postgres:15-alpine
    container_name: pqc-scanner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-quarkshield_scanner}
    volumes:
      - scanner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quarkshield_scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  scanner-console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-scanner-console
    restart: unless-stopped
    ports:
      - "80:5050"
      - "443:5443"
      - "${PORT:-5050}:5050"
      - "5001:5050"
      - "5002:5050"
      - "5003:5050"
      - "5004:5050"
      - "5005:5050"
    depends_on:
      scanner-db:
        condition: service_healthy
    environment:
      - PORT=5050
      - NODE_ENV=production
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=scanner-db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-quarkshield_scanner}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_FROM=${SMTP_FROM:-License@quarkshield.ai}
    volumes:
      - ./.env:/app/.env

volumes:
  scanner_pg_data:
    driver: local
